name: Update public watchlist
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths: ['export-watchlist.mjs', 'public-watchlist.mjs', '.github/workflows/watchlist.yml']
permissions:
  contents: write
concurrency:
  group: public-watchlist
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node public-watchlist.test.mjs
      - run: node export-watchlist.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Publish safe summary only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- watchlist.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public watchlist summary'
          git pull --rebase origin main
          git push origin HEAD:main
